<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b91c1c" />
      <stop offset="100%" style="stop-color:#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <!-- Face scan icon -->
  <g transform="translate(256,256)" stroke="white" fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-left corner -->
    <path d="M-100,-120 L-120,-120 L-120,-100" />
    <!-- Top-right corner -->
    <path d="M100,-120 L120,-120 L120,-100" />
    <!-- Bottom-left corner -->
    <path d="M-120,100 L-120,120 L-100,120" />
    <!-- Bottom-right corner -->
    <path d="M100,120 L120,120 L120,100" />
    <!-- Scan line -->
    <line x1="-90" y1="0" x2="90" y2="0" stroke-width="12" opacity="0.7" />
    <!-- Face oval -->
    <ellipse cx="0" cy="-10" rx="55" ry="70" stroke-width="14" />
    <!-- Eyes -->
    <circle cx="-22" cy="-25" r="5" fill="white" stroke="none" />
    <circle cx="22" cy="-25" r="5" fill="white" stroke="none" />
    <!-- Smile -->
    <path d="M-18,10 Q0,28 18,10" stroke-width="10" fill="none" />
  </g>
</svg>
